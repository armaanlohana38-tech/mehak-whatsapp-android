name: Build Mehak WhatsApp APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble web UI asset from repo parts
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat assetsrc/part0.b64 assetsrc/part1.b64 assetsrc/part2.b64 > /tmp/ui.b64
          base64 -d /tmp/ui.b64 > /tmp/ui.gz
          gzip -t /tmp/ui.gz
          gunzip -c /tmp/ui.gz > app/src/main/assets/index.html
          echo "--- asset size ---"
          wc -c app/src/main/assets/index.html
          echo "--- sha256 ---"
          sha256sum app/src/main/assets/index.html
          echo "--- markers ---"
          grep -c "AndroidSpeech" app/src/main/assets/index.html || true
          grep -c "respondGroup" app/src/main/assets/index.html || true
          grep -c "errBanner" app/src/main/assets/index.html || true
          grep -c "I am Mehak your Soniya" app/src/main/assets/index.html || true
          test -s app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK contains the new UI
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -l "$APK"
          sha256sum "$APK"
          mkdir -p /tmp/apkx && cd /tmp/apkx && rm -rf * && unzip -o -q "$OLDPWD/$APK"
          echo "--- embedded asset ---"
          wc -c assets/index.html
          sha256sum assets/index.html
          grep -c "I am Mehak your Soniya" assets/index.html
          grep -c "errBanner" assets/index.html
          echo "--- dex ---"
          ls -l classes*.dex | head

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mehak-whatsapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mehak WhatsApp APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
