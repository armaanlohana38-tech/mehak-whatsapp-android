name: Build Mehak WhatsApp APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI patches
        run: |
          set -euo pipefail
          echo "--- before ---"
          wc -c app/src/main/assets/index.html
          sha256sum app/src/main/assets/index.html
          for p in patchsrc/p0.diff patchsrc/p1.diff patchsrc/p2.diff patchsrc/p3.diff patchsrc/p4.diff patchsrc/p5.diff; do
            echo "applying $p"
            patch -p1 --no-backup-if-mismatch < "$p"
          done
          echo "--- after ---"
          wc -c app/src/main/assets/index.html
          sha256sum app/src/main/assets/index.html
          echo "--- sanity ---"
          head -c 15 app/src/main/assets/index.html | grep -q "<!DOCTYPE html" || { echo "NOT HTML"; exit 1; }
          tail -c 20 app/src/main/assets/index.html | grep -q "</html>" || { echo "TRUNCATED HTML"; exit 1; }
          test "$(wc -c < app/src/main/assets/index.html)" -gt 150000 || { echo "TOO SMALL"; exit 1; }
          echo "--- markers (each must be >=1) ---"
          for m in "I am Mehak and you are supposed to be Sonia." "speechText" "sorry, who are you?" "errBanner" "respondGroup" "AndroidSpeech" "testConnBtn"; do
            n=$(grep -c "$m" app/src/main/assets/index.html || true)
            echo "$m -> $n"
            test "$n" -ge 1 || { echo "MISSING MARKER: $m"; exit 1; }
          done
          echo "--- old error text must be gone ---"
          test "$(grep -c 'network issue lag raha hai' app/src/main/assets/index.html || true)" -eq 0 || { echo "OLD ERROR TEXT STILL PRESENT"; exit 1; }
          echo "--- JS syntax ---"
          python3 - <<'PY'
          import re
          h=open('app/src/main/assets/index.html',encoding='utf-8').read()
          s=re.findall(r'<script[^>]*>(.*?)</script>', h, re.S)
          open('/tmp/app.js','w',encoding='utf-8').write("\n".join(s))
          print("scripts:",len(s))
          PY
          node --check /tmp/app.js && echo "JS_SYNTAX_OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK contains the new UI
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -l "$APK"
          sha256sum "$APK"
          mkdir -p /tmp/apkx && cd /tmp/apkx && rm -rf ./* && unzip -o -q "$OLDPWD/$APK"
          echo "--- embedded asset ---"
          wc -c assets/index.html
          sha256sum assets/index.html
          echo "--- must match the patched source ---"
          sha256sum "$OLDPWD/app/src/main/assets/index.html"
          cmp assets/index.html "$OLDPWD/app/src/main/assets/index.html" && echo "ASSET_MATCHES_SOURCE"
          for m in "I am Mehak and you are supposed to be Sonia." "speechText" "sorry, who are you?" "errBanner"; do
            n=$(grep -c "$m" assets/index.html || true)
            echo "$m -> $n"
            test "$n" -ge 1 || { echo "MISSING IN APK: $m"; exit 1; }
          done
          echo "--- dex ---"
          ls -l classes*.dex | head

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mehak-whatsapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mehak WhatsApp APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
